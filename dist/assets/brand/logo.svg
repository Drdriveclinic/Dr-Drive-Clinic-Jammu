<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="320" height="84" fill="none" aria-label="THE DRIVE CLINIC">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="silverGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- =========================================================================
       ICONIC SPORTS CAR SILHOUETTE (EXACT SHAPE FROM ORIGINAL LOGO)
       Coupe/Supercar facing right: rear spoiler, sweeping roofline, windshield with mirror,
       low hood, front nose, front wheel arch, dynamic lower red body scoop, and sparkle glints.
       ========================================================================= -->
  <g id="car-silhouette" transform="translate(10, 2)">
    <!-- Main Upper Roofline & Body Contour (White) -->
    <!-- Starts at rear spoiler tip, arches over cabin, slants down windshield, side mirror notch, hood, nose & wheel arch -->
    <path d="M 18 29 C 32 27, 48 24, 68 20 C 92 15, 118 7, 148 6 C 172 6, 196 9, 218 16 C 228 20, 238 25, 246 31 L 243 33 L 248 32 C 258 32, 276 33, 290 35 C 296 37, 301 40, 302 44 C 298 45, 292 45, 286 44 C 280 39, 272 36, 258 36 C 248 36, 240 40, 236 45" 
          stroke="url(#silverGloss)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Inner Greenhouse & Side Window Line -->
    <path d="M 152 10 C 174 10, 194 13, 212 19 C 220 22, 226 26, 232 30" 
          stroke="url(#silverGloss)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Side-view mirror pod detail -->
    <ellipse cx="244" cy="31" rx="2.5" ry="1.2" fill="url(#silverGloss)" />

    <!-- Front Wheel Arch Highlight Curve -->
    <path d="M 236 45 C 240 39, 249 35, 260 35 C 271 35, 279 38, 284 44" 
          stroke="url(#silverGloss)" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Front Headlight & Nose Glint Accent -->
    <path d="M 290 36 C 296 38, 300 41, 302 44 C 301 46, 298 47, 295 47" 
          stroke="url(#silverGloss)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Iconic Dynamic Red Lower Body Scoop & Speed Line -->
    <!-- Follows muscular rear shoulder haunch, drops down mid-door, runs forward horizontally along lower sill -->
    <path d="M 30 33 C 50 30, 80 25, 110 20 C 132 18, 150 18, 166 21 C 176 23, 184 27, 194 33 C 204 37, 218 37, 235 37 C 246 37, 252 36, 256 34" 
          stroke="url(#redGlow)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Rear Tail Accent Dots (Speed Pulse) -->
    <circle cx="258" cy="27" r="1.5" fill="url(#redGlow)" />
    <circle cx="258" cy="32" r="1.5" fill="url(#redGlow)" />

    <!-- Iconic 4-Point Detailing Starlight Glints (Where Cars Get Their Shine Back) -->
    <!-- Glint 1: Rear Spoiler Tip -->
    <g transform="translate(18, 29)" filter="url(#sparkleGlow)">
      <polygon points="0,-6 1,-1 6,0 1,1 0,6 -1,1 -6,0 -1,-1" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
    </g>
    <!-- Glint 2: Peak of Cabin Roofline -->
    <g transform="translate(150, 6)" filter="url(#sparkleGlow)">
      <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
    <!-- Glint 3: Windshield A-Pillar -->
    <g transform="translate(224, 18)" filter="url(#sparkleGlow)">
      <polygon points="0,-6 1,-1 6,0 1,1 0,6 -1,1 -6,0 -1,-1" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
    </g>
    <!-- Glint 4: Front Headlight -->
    <g transform="translate(296, 38)" filter="url(#sparkleGlow)">
      <polygon points="0,-5 1,-1 5,0 1,1 0,5 -1,1 -5,0 -1,-1" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- =========================================================================
       BRAND TYPOGRAPHY: "THE DRIVE CLINIC" + "TDC" BADGE
       100% White & Radiant Red for Ultra-Clear Mobile & Desktop Visibility
       ========================================================================= -->
  <g id="brand-typography">
    <!-- "THE" - Bold Header -->
    <text x="18" y="60" 
          font-family="'Montserrat', 'Space Grotesk', system-ui, sans-serif" 
          font-size="14" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="0.14em" 
          fill="#FFFFFF">THE</text>

    <!-- Racing Slanted Red Slash -->
    <polygon points="62,48 67,48 61,64 56,64" fill="url(#redGlow)" />

    <!-- "DRIVE" (Brilliant White) & "CLINIC" (Radiant Red) -->
    <text x="74" y="63" 
          font-family="'Montserrat', 'Impact', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="0.04em">
      <tspan fill="#FFFFFF">DRIVE </tspan>
      <tspan fill="url(#redGlow)">CLINIC</tspan>
    </text>

    <!-- Precision Racing Red Separator Line -->
    <line x1="74" y1="69" x2="276" y2="69" stroke="url(#redGlow)" stroke-width="2" stroke-linecap="round" />

    <!-- Subtitle Tagline: "WHERE CARS GET THEIR SHINE BACK" / TDC -->
    <text x="74" y="78" 
          font-family="'Space Grotesk', system-ui, sans-serif" 
          font-size="7.5" 
          font-weight="800" 
          letter-spacing="0.24em" 
          fill="#CBD5E1">WHERE CARS GET THEIR SHINE BACK • THE TDC</text>
  </g>
</svg>
