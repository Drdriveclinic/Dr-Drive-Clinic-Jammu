<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bikeSpotlight" cx="65%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2022" />
      <stop offset="60%" stop-color="#120e10" />
      <stop offset="100%" stop-color="#050405" />
    </radialGradient>
    <linearGradient id="bikeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8a0006" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bikeSpotlight)" />

  <!-- Superbike Silhouette in Detailing Bay -->
  <g transform="translate(680, 260)">
    <!-- Shadow -->
    <ellipse cx="500" cy="500" rx="420" ry="25" fill="#000000" opacity="0.85" />
    
    <!-- Rear Wheel -->
    <g transform="translate(180, 400)">
      <circle cx="0" cy="0" r="100" fill="#0d0d0d" stroke="#333" stroke-width="12" />
      <circle cx="0" cy="0" r="70" fill="#151515" stroke="#E50914" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#252525" />
      <!-- Brake Disc -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="8,4" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(820, 400)">
      <circle cx="0" cy="0" r="100" fill="#0d0d0d" stroke="#333" stroke-width="12" />
      <circle cx="0" cy="0" r="70" fill="#151515" stroke="#E50914" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#252525" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="8,4" />
    </g>

    <!-- Exhaust / Engine Block -->
    <rect x="280" y="360" width="180" height="40" rx="10" fill="#444" stroke="#777" stroke-width="2" transform="rotate(-15 280 360)" />
    <path d="M 380 330 L 520 330 L 480 410 L 360 410 Z" fill="#1f1f1f" stroke="#333" stroke-width="2" />
    
    <!-- Trellis Frame -->
    <path d="M 280 340 L 480 240 L 640 240 L 750 340" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 380 340 L 540 240" stroke="url(#bikeFrame)" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Fuel Tank & Fairing -->
    <path d="M 420 230 Q 560 140 680 200 Q 720 220 740 250 L 540 260 Z" fill="#0a0a0a" stroke="#E50914" stroke-width="3" />
    <!-- Tank Gloss Highlight -->
    <path d="M 460 210 Q 550 160 640 190" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none" />
    
    <!-- Front Fork & Clip-ons -->
    <line x1="720" y1="210" x2="820" y2="400" stroke="#888" stroke-width="14" stroke-linecap="round" />
    <line x1="700" y1="180" x2="740" y2="200" stroke="#fff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tail Section & Seat -->
    <path d="M 260 270 L 400 250 L 420 280 L 260 300 Z" fill="#111" stroke="#333" stroke-width="2" />
  </g>
</svg>
