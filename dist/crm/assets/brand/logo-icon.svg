<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" aria-label="THE TDC Icon">
  <defs>
    <linearGradient id="iconRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#C4050E" />
    </linearGradient>
    <linearGradient id="iconSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#090B10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Car Roofline Silhouette atop icon -->
  <path d="M 10 20 C 18 16, 26 12, 33 12 C 40 12, 48 15, 54 20" stroke="url(#iconRed)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 22 15 C 27 13.5, 33 13.5, 42 15" stroke="url(#iconSilver)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Typographic Monogram "TDC" -->
  <text x="32" y="44" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.02em" 
        text-anchor="middle">
    <tspan fill="url(#iconSilver)">T</tspan>
    <tspan fill="url(#iconRed)" dx="1">D</tspan>
    <tspan fill="url(#iconSilver)" dx="1">C</tspan>
  </text>
  <rect x="15" y="49" width="34" height="2.5" rx="1.2" fill="url(#iconRed)" />
</svg>
