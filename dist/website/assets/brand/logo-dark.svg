<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="240" height="68" fill="none" aria-label="THE TDC">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#D9040D" />
    </linearGradient>
    <linearGradient id="silverGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- ICONIC SUPERCAR ROOFLINE & SILHOUETTE (FROM PREVIOUS BRAND LOGO) -->
  <!-- Aerodynamic roofline sweep -->
  <path d="M 14 21 C 34 17, 62 13, 86 9 C 102 5, 118 2.5, 138 2.5 C 158 2.5, 176 6, 192 12 C 206 17, 220 20, 230 21" stroke="url(#redGlow)" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- Windshield and greenhouse canopy -->
  <path d="M 90 9 C 104 5, 118 3.5, 136 3.5 C 154 3.5, 168 6, 180 11" stroke="url(#silverGloss)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8" />
  <!-- Aerodynamic hood intake accent -->
  <path d="M 28 21 C 44 18, 64 15, 80 12" stroke="url(#redGlow)" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  <circle cx="226" cy="19" r="1.6" fill="url(#redGlow)" />

  <!-- BRAND TYPOGRAPHY: "THE TDC" -->
  <text x="14" y="49" 
        font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
        font-size="20" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.12em" 
        fill="#FFFFFF">THE</text>

  <!-- Racing Slanted Red Slash -->
  <polygon points="74,29 80,29 73,51 67,51" fill="url(#redGlow)" />

  <!-- "TDC" - Ultra-Bold Display Lettering with Iconic Center Red D -->
  <text x="86" y="51" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="34" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.04em">
    <tspan fill="url(#silverGloss)">T</tspan>
    <tspan fill="url(#redGlow)" dx="1">D</tspan>
    <tspan fill="url(#silverGloss)" dx="1">C</tspan>
  </text>

  <!-- Racing Red Underline Accent -->
  <line x1="86" y1="56" x2="174" y2="56" stroke="url(#redGlow)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Subtitle Tagline -->
  <text x="86" y="64" 
        font-family="'Space Grotesk', system-ui, sans-serif" 
        font-size="7" 
        font-weight="800" 
        letter-spacing="0.22em" 
        fill="#94A3B8">THE DRIVE CLINIC // JAMMU</text>
</svg>