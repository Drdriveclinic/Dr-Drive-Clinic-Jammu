<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" width="190" height="44" fill="none" aria-label="THE DDC">
  <defs>
    <!-- High-Impact Automotive Gradients -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#D9040D" />
    </linearGradient>
    <linearGradient id="silverGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- PURE TYPOGRAPHY LOGO: "THE DDC" (NO SHIELD/EMBLEM) -->
  
  <!-- "THE" - Ultra-Bright, Bold, High Visibility -->
  <text x="4" y="31" 
        font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.12em" 
        fill="#FFFFFF">THE</text>

  <!-- Dynamic Automotive Slant / Racing Slash -->
  <polygon points="62,11 67,11 61,33 56,33" fill="url(#redGlow)" />

  <!-- "DDC" - Ultra-Bold Display Lettering with Iconic Red Center D -->
  <text x="73" y="33" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="36" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.04em">
    <tspan fill="url(#silverGloss)">D</tspan>
    <tspan fill="url(#redGlow)" dx="1">D</tspan>
    <tspan fill="url(#silverGloss)" dx="1">C</tspan>
  </text>

  <!-- Subtle Racing Red Underline Accent -->
  <line x1="73" y1="39" x2="158" y2="39" stroke="url(#redGlow)" stroke-width="2.5" stroke-linecap="round" />
</svg>