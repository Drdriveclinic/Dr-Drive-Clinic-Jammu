# Netlify Deployment Configuration for The Drive Clinic
[build]
  publish = "dist"
  command = "node scripts/build-netlify.js"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/appointments"
  to = "/.netlify/functions/appointments"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/crm/login"
  to = "/crm/index.html"
  status = 200

[[redirects]]
  from = "/crm/*"
  to = "/crm/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
